run_name: demo
output_root: outputs
seed: 13
data:
  source: synthetic
  root: data/synthetic
  lits_dirs: []
  n_cases: 120
  max_cases: null
  split_strategy: random
  split_fractions:
    train: 0.4
    val: 0.07
    calib: 0.265
    test: 0.265
  notebook_seed: 42
  notebook_n_train: 80
  notebook_val_frac: 0.15
  calib_fraction_of_heldout: 0.5
preprocess:
  hu_window:
  - -100
  - 250
  img_size: 128
  margin_slices: 8
segmenter:
  backend: voxel_gbm
  checkpoint: null
  init_from: null
  vit_name: vit_small_patch16_224.augreg_in21k_ft_in1k
  pretrained: true
  decoder_dropout: 0.1
  unet_base: 16
  epochs: 30
  batch_size: 16
  lr_encoder: 0.0001
  lr_decoder: 0.0005
  weight_decay: 0.01
  grad_clip: 1.0
  num_workers: 2
  class_weights:
  - 1.0
  - 1.0
  - 3.0
  tumour_oversample: 3.0
  device: auto
  gbm:
    n_members: 3
    pixels_per_case: 6000
    max_iter: 100
    learning_rate: 0.1
    max_leaf_nodes: 31
inference:
  tta_flip: true
  mc_samples: 2
  batch_size: 16
  min_lesion_ml: 0.1
  min_lesion_peak_prob: 0.7
  viewer_size: 128
  viewer_max_slices: 96
  eval_splits:
  - calib
  - test
confidence:
  method: auto
  n_bins: 10
  pass_std_ref: 0.15
  target_min_tumour_ml: 0.0
quality:
  liver_ml_range:
  - 500.0
  - 4500.0
  spacing_mm_range:
  - 0.3
  - 8.0
  min_slices: 16
  max_tumour_outside_liver_frac: 0.25
  min_outside_ml: 1.0
triage:
  suggest_threshold: 0.5
  urgent_probability: 0.85
  urgent_volume_ml: 5.0
  urgent_diameter_mm: 20.0
  uncertain_flag: 0.6
  volume_ref_ml: 50.0
  weights:
    probability: 0.6
    volume: 0.25
    uncertainty: 0.15
policy:
  universal_threshold: 0.5
  threshold_grid:
  - 0.1
  - 0.15
  - 0.2
  - 0.25
  - 0.3
  - 0.35
  - 0.4
  - 0.45
  - 0.5
  - 0.55
  - 0.6
  - 0.65
  - 0.7
  - 0.75
  - 0.8
  - 0.85
  - 0.9
  defer_grid:
  - null
  - 0.9
  - 0.8
  - 0.7
  - 0.6
  - 0.5
  - 0.4
  - 0.3
  w_fn: 2.0
  w_fp: 1.0
  burden_weight: 0.02
  action_cost:
    accept: 1
    reject: 2
    edit: 3
    manual: 4
  min_feedback: 10
  min_improvement: 0.005
  improvement_se: 1.0
  shrink_rho: 0.02
  trust_prior:
    alpha_mean: 0.0
    alpha_sd: 1.5
    beta_mean: 4.0
    beta_sd: 3.0
readers:
  seeds: 30
  learning_curve_n:
  - 0
  - 5
  - 10
  - 15
  - 20
  - 25
  - 32
  profiles:
    reader_a:
      name: Reader A - over-reliant
      description: Accepts most AI suggestions, switches to the AI easily.
      sens_a: 0.8
      sens_b: 1.5
      sens_c: 0.8
      fpr: 0.12
      trust_k: 8.0
      trust_tau: 0.55
      lapse: 0.02
      edit_poor: 0.2
      edit_noise: 0.02
    reader_b:
      name: Reader B - sceptical
      description: Conservative caller; rejects many suggestions, rarely switches.
      sens_a: 0.9
      sens_b: 1.8
      sens_c: 0.8
      fpr: 0.04
      trust_k: 6.0
      trust_tau: 0.97
      lapse: 0.02
      edit_poor: 0.8
      edit_noise: 0.15
    reader_c:
      name: Reader C - inconsistent
      description: Noisy, inconsistent decisions and corrections.
      sens_a: 0.7
      sens_b: 1.0
      sens_c: 0.6
      fpr: 0.15
      trust_k: 1.5
      trust_tau: 0.6
      lapse: 0.15
      edit_poor: 0.5
      edit_noise: 0.3
agent:
  planner: rule
  max_steps: 12
  llm:
    base_url: http://localhost:11434/v1
    model: qwen2.5:7b-instruct
    api_key_env: LLM_API_KEY
    timeout_s: 60
    temperature: 0.0
