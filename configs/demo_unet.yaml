# Synthetic phantoms + the small 2.5D U-Net (PyTorch). CPU works (~20-40 min); a GPU takes minutes.
# Reuses the phantoms generated for the 'demo' run.
run_name: demo_unet
seed: 13

data:
  source: synthetic
  root: data/synthetic
  n_cases: 120
  split_strategy: random
  split_fractions: {train: 0.40, val: 0.07, calib: 0.265, test: 0.265}

preprocess:
  img_size: 128
  margin_slices: 8

segmenter:
  backend: unet25d
  unet_base: 16
  decoder_dropout: 0.1
  epochs: 12
  batch_size: 16
  lr_decoder: 1.0e-3
  num_workers: 0

inference:
  tta_flip: true
  mc_samples: 2
  batch_size: 16

readers:
  seeds: 30
