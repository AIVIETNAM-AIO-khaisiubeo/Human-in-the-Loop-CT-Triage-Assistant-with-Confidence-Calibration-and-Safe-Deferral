# Quick CPU demo: synthetic LiTS-style phantoms + the classical voxel-GBM segmenter.
# Runs end-to-end on a laptop in ~10-15 minutes:  python -m radagent all --config configs/demo.yaml
run_name: demo
seed: 13

data:
  source: synthetic
  root: data/synthetic
  n_cases: 120
  split_strategy: random
  split_fractions: {train: 0.40, val: 0.07, calib: 0.265, test: 0.265}

preprocess:
  img_size: 128

segmenter:
  backend: voxel_gbm
  gbm: {n_members: 3, pixels_per_case: 6000, max_iter: 100}

inference:
  batch_size: 16
  viewer_max_slices: 96

readers:
  seeds: 30
